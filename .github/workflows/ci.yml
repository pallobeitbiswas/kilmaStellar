name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Smart Contract Tests ────────────────────────────────────────
  # Each contract is tested in a parallel matrix job.
  # Cargo.lock is committed per-contract to pin exact crate versions
  # and avoid transitive breaking changes (e.g. soroban-env-host pulling
  # in ed25519-dalek v3 which breaks CryptoRng trait bounds).
  rust-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        contract:
          - contracts/escrow-contract
          - contracts/registry-contract
          - contracts/finance-contract

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.contract }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.contract)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.contract }}-

      - name: Run Contract Tests
        run: cargo test
        working-directory: ${{ matrix.contract }}

  # ── Frontend Tests ──────────────────────────────────────────────
  # Uses `npm ci` (not `npm install`) to ensure package-lock.json is
  # respected exactly — fails fast on any package.json/lock mismatch.
  frontend-tests:
    name: Vite Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies (locked)
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Run Build
        run: npm run build
        env:
          VITE_STELLAR_RPC_URL: https://soroban-testnet.stellar.org:443
          VITE_ESCROW_CONTRACT_ID: CBEBKFQAP46KIKWE4ECUZNTGD6T433NHQYY7DQSVQ2REVG7WAVQE64ZA
          VITE_PROJECT_CONTRACT_ID: CA7MSP7ENYQENDNQT23N3GREKOKU6ZPJZAZUDCVMB6YA4HLRWSAQ4WCW
